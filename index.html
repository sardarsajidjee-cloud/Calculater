<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator with History</title>
  <link rel="stylesheet" href="File.css">
</head>
<body>
  <div class="calculator">
    <h1>Calculator</h1>

    <!-- Display -->
    <input type="text" id="display" placeholder="0" disabled>

    <!-- Buttons -->
    <div class="buttons">
      <!-- Row 1 -->
      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button onclick="setOperator('/')">÷</button>

      <!-- Row 2 -->
      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button onclick="setOperator('*')">×</button>

      <!-- Row 3 -->
      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button onclick="setOperator('-')">-</button>

      <!-- Row 4 -->
      <button onclick="appendNumber('0')">0</button>
      <button onclick="appendNumber('.')">.</button>
      <button onclick="calculate()">=</button>
      <button onclick="setOperator('+')">+</button>

      <!-- Clear button -->
      <button onclick="clearAll()" class="clear">C</button>
    </div>

    <!-- History button -->
    <button onclick="toggleHistory()" class="history-btn">Show/Hide History</button>

    <!-- History Div -->
    <div id="historyDiv" style="display: none;">
      <h3>History</h3>
      <ul id="historyList"></ul>
    </div>
  </div>

  <script src="App.js"></script>
</body>
  </html>
